<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack en Go</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>♠️ Blackjack en Go</h1>
    <p><strong>Jugador:</strong> {{.Player}} (Total: {{len .Player}} cartas)</p>
    <p><strong>Dealer:</strong> {{.Dealer}}</p>
    <h2>{{.Message}}</h2>

    {{if not .GameOver}}
        <a href="/?action=hit">Pedir carta</a> |
        <a href="/?action=stand">Plantarse</a>
    {{else}}
        <a href="/?action=new">Jugar otra vez</a>
    {{end}}
</body>
</html>
